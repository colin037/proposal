<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Something I Want To Tell You</title>

    <link rel="stylesheet" href="css/message.css" />
  </head>

  <body>
    <main class="message-page">
      <section class="message-content">
        <p class="message-text">
          <span class="message-line">
            There is something<br />
            I've been wanting to tell you from yesterday onwards...
          </span>

          <span class="message-line">
            Maybe I don't know where<br />
            this will go...
          </span>

          <span class="message-line">
            but I wanted to be honest<br />
            about how I feel.
          </span>

          <span class="message-line">
            Even if this doesn't work out<br />
            I still want you to be a good friend of mine.
          </span>
        </p>
      </section>

      <div class="scroll-indicator">
        <span>↓</span>
        <p>Scroll down</p>
      </div>
      <button id="message-next">Continue</button>
    </main>

    <script src="js/message.js"></script>
  </body>
</html>
